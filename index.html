<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eastbox Task Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-primary': '#14b8a6', // teal-500
            'brand-secondary': '#0f766e', // teal-700
            'base-100': '#1f2937', // gray-800
            'base-200': '#374151', // gray-700
            'base-300': '#4b5563', // gray-600
            'base-content': '#f9fafb', // gray-50
            'info': '#38bdf8', // sky-400
            'success': '#34d399', // emerald-400
            'warning': '#facc15', // yellow-400
            'error': '#f87171', // red-400
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: sans-serif;
    }
    @keyframes modal-enter {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-modal-enter {
      animation: modal-enter 0.2s ease-out forwards;
    }
    input[type="date"]:not(:valid):before {
        content: "Select date";
        color: #9ca3af;
    }
    .task-card {
      cursor: grab;
    }
    .task-card:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="bg-base-100 text-base-content antialiased">
  
  <div id="app-container" class="flex flex-col h-screen font-sans">
    <!-- Header -->
    <header class="bg-base-200 shadow-md p-4 flex-shrink-0 z-10">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-8 h-8 text-brand-primary"
          >
            <path
              fill-rule="evenodd"
              d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm8.706-1.442c1.146-.573 2.437.463 2.126 1.706l-.709 2.836.042-.02a.75.75 0 01.67 1.34l-.04.022c-1.147.573-2.438-.463-2.127-1.706l.71-2.836-.042.02a.75.75 0 11-.671-1.34l.041-.022zM12 9a.75.75 0 100-1.5.75.75 0 000 1.5z"
              clip-rule="evenodd"
            />
          </svg>
          <h1 class="text-xl md:text-2xl font-bold text-base-content">
            Eastbox Web Studio <span class="font-light">Tasks</span>
          </h1>
        </div>
        <button
          id="add-task-btn"
          class="flex items-center gap-2 bg-brand-primary hover:bg-brand-secondary text-white font-semibold py-2 px-4 rounded-lg shadow-sm transition-all duration-300 transform hover:scale-105"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
          </svg>
          <span class="hidden sm:inline">Add New Task</span>
        </button>
      </div>
      <!-- Progress Bar -->
      <div>
        <div class="flex justify-between items-center mb-1">
            <span class="text-sm font-medium text-gray-400">Project Progress</span>
            <span id="progress-text" class="text-sm font-bold text-base-content">0%</span>
        </div>
        <div class="w-full bg-base-300 rounded-full h-2.5">
            <div id="progress-bar" class="bg-brand-primary h-2.5 rounded-full transition-all duration-500" style="width: 0%;">
            </div>
        </div>
      </div>
    </header>

    <!-- Kanban Board -->
    <main class="flex-1 overflow-x-auto p-4 md:p-6 lg:p-8">
      <div id="kanban-board" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 h-full">
        <!-- Columns will be generated by JS -->
      </div>
    </main>
  </div>

  <!-- Add/Edit Task Modal -->
  <div id="task-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4 hidden">
    <div class="bg-base-200 rounded-xl shadow-2xl p-6 md:p-8 w-full max-w-lg transform transition-all duration-300 scale-95 animate-modal-enter">
      <h2 id="modal-title" class="text-2xl font-bold mb-6">Add New Task</h2>
      <form id="task-form">
        <input type="hidden" id="task-id">
        <div class="mb-4">
          <label for="title" class="block text-sm font-medium text-gray-300 mb-2">Title</label>
          <input id="task-title" type="text" class="w-full bg-base-300 border border-base-100 rounded-lg px-3 py-2 text-base-content focus:outline-none focus:ring-2 focus:ring-brand-primary" required>
        </div>
        <div class="mb-4">
          <label for="description" class="block text-sm font-medium text-gray-300 mb-2">Description</label>
          <textarea id="task-description" rows="4" class="w-full bg-base-300 border border-base-100 rounded-lg px-3 py-2 text-base-content focus:outline-none focus:ring-2 focus:ring-brand-primary"></textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div>
              <label for="assignee" class="block text-sm font-medium text-gray-300 mb-2">Assign To</label>
              <input id="task-assignee" type="text" placeholder="e.g., John Doe" class="w-full bg-base-300 border border-base-100 rounded-lg px-3 py-2 text-base-content focus:outline-none focus:ring-2 focus:ring-brand-primary">
          </div>
          <div>
              <label for="dueDate" class="block text-sm font-medium text-gray-300 mb-2">Due Date</label>
              <input id="task-duedate" type="date" class="w-full bg-base-300 border border-base-100 rounded-lg px-3 py-2 text-base-content focus:outline-none focus:ring-2 focus:ring-brand-primary">
          </div>
        </div>
        <div class="flex justify-end gap-4">
          <button id="modal-cancel-btn" type="button" class="py-2 px-4 bg-base-300 hover:bg-base-100 text-base-content font-semibold rounded-lg transition-colors">
            Cancel
          </button>
          <button id="modal-save-btn" type="submit" class="py-2 px-6 bg-brand-primary hover:bg-brand-secondary text-white font-semibold rounded-lg shadow-sm transition-colors">
            Add Task
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const TaskStatus = {
        ToDo: 'To Do',
        InProgress: 'In Progress',
        Review: 'Review',
        Done: 'Done',
      };

      const statusColors = {
        [TaskStatus.ToDo]: 'bg-info/20 border-info',
        [TaskStatus.InProgress]: 'bg-warning/20 border-warning',
        [TaskStatus.Review]: 'bg-purple-400/20 border-purple-400',
        [TaskStatus.Done]: 'bg-success/20 border-success',
      };

      // State
      let tasks = [];

      // DOM Elements
      const addTaskBtn = document.getElementById('add-task-btn');
      const taskModal = document.getElementById('task-modal');
      const taskForm = document.getElementById('task-form');
      const modalCancelBtn = document.getElementById('modal-cancel-btn');
      const kanbanBoard = document.getElementById('kanban-board');
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');

      // Modal form fields
      const modalTitle = document.getElementById('modal-title');
      const modalSaveBtn = document.getElementById('modal-save-btn');
      const taskIdInput = document.getElementById('task-id');
      const taskTitleInput = document.getElementById('task-title');
      const taskDescriptionInput = document.getElementById('task-description');
      const taskAssigneeInput = document.getElementById('task-assignee');
      const taskDueDateInput = document.getElementById('task-duedate');

      // --- Data Persistence ---
      const saveTasks = () => {
        try {
          localStorage.setItem('eastbox-tasks', JSON.stringify(tasks));
        } catch (error) {
          console.error("Failed to save tasks to local storage", error);
        }
        render();
      };

      const loadTasks = () => {
        try {
          const savedTasks = localStorage.getItem('eastbox-tasks');
          tasks = savedTasks ? JSON.parse(savedTasks) : [];
        } catch (error) {
          console.error("Failed to load tasks from local storage", error);
          tasks = [];
        }
        render();
      };

      // --- Modal Logic ---
      const openModal = (task = null) => {
        taskForm.reset();
        if (task) {
          modalTitle.textContent = 'Edit Task';
          modalSaveBtn.textContent = 'Save Changes';
          taskIdInput.value = task.id;
          taskTitleInput.value = task.title;
          taskDescriptionInput.value = task.description;
          taskAssigneeInput.value = task.assignee || '';
          taskDueDateInput.value = task.dueDate || '';
        } else {
          modalTitle.textContent = 'Add New Task';
          modalSaveBtn.textContent = 'Add Task';
          taskIdInput.value = '';
        }
        taskModal.classList.remove('hidden');
      };

      const closeModal = () => {
        taskModal.classList.add('hidden');
      };

      // --- Task Management ---
      const handleSaveTask = (e) => {
        e.preventDefault();
        const id = taskIdInput.value;
        const taskData = {
          title: taskTitleInput.value.trim(),
          description: taskDescriptionInput.value.trim(),
          assignee: taskAssigneeInput.value.trim(),
          dueDate: taskDueDateInput.value,
        };

        if (taskData.title === '') return;

        if (id) {
          tasks = tasks.map(task => 
            task.id === id ? { ...task, ...taskData } : task
          );
        } else {
          const newTask = {
            ...taskData,
            id: `task-${Date.now()}`,
            status: TaskStatus.ToDo,
          };
          tasks.push(newTask);
        }
        
        closeModal();
        saveTasks();
      };

      const handleDeleteTask = (taskId) => {
        tasks = tasks.filter(task => task.id !== taskId);
        saveTasks();
      };

      const handleStatusChange = (taskId, newStatus) => {
        const task = tasks.find(t => t.id === taskId);
        if (task) {
          task.status = newStatus;
          saveTasks();
        }
      };
      
      // --- Drag and Drop ---
      const handleDragStart = (e) => {
        e.dataTransfer.setData('taskId', e.target.dataset.taskId);
        setTimeout(() => e.target.classList.add('opacity-50'), 0);
      };
      
      const handleDragEnd = (e) => {
        e.target.classList.remove('opacity-50');
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        const column = e.currentTarget;
        column.classList.add('bg-base-300/50');
      };

      const handleDragLeave = (e) => {
        e.currentTarget.classList.remove('bg-base-300/50');
      };

      const handleDrop = (e) => {
        e.preventDefault();
        const column = e.currentTarget;
        column.classList.remove('bg-base-300/50');
        const taskId = e.dataTransfer.getData('taskId');
        const newStatus = column.dataset.status;
        if (taskId && newStatus) {
            handleStatusChange(taskId, newStatus);
        }
      };

      // --- Rendering ---
      const createTaskCardHTML = (task) => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const isOverdue = task.dueDate && new Date(task.dueDate) < today;

        const formattedDate = task.dueDate ? new Date(task.dueDate).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
          }) : '';

        return `
          <div
            id="${task.id}"
            data-task-id="${task.id}"
            draggable="true"
            class="task-card bg-base-200 p-4 rounded-lg shadow-md border-l-4 border-brand-primary group transition-all duration-300 hover:shadow-lg hover:bg-base-300"
          >
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-base-content pr-2">${task.title}</h3>
              <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                ${task.status !== TaskStatus.Done ? `
                  <button data-action="complete" class="text-gray-400 hover:text-success" title="Complete Task">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 pointer-events-none"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"></path></svg>
                  </button>` 
                : ''}
                <button data-action="edit" class="text-gray-400 hover:text-info" title="Edit Task">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 pointer-events-none"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"></path></svg>
                </button>
                <button data-action="delete" class="text-gray-400 hover:text-error" title="Delete Task">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 pointer-events-none"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.134-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.067-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"></path></svg>
                </button>
              </div>
            </div>
            <p class="text-sm text-gray-400 mb-4">${task.description || '&nbsp;'}</p>
            <div class="flex items-center justify-between text-xs text-gray-400 pt-2 border-t border-base-300/50">
              <div class="flex items-center gap-2">
                ${task.assignee ? `
                  <div class="flex items-center gap-1 bg-base-300 px-2 py-1 rounded-full">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-3 h-3"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12.735 14c.618 0 1.093-.561.872-1.139a6.002 6.002 0 0 0-11.215 0c-.22.578.254 1.139.872 1.139h9.47Z"></path></svg>
                      <span>${task.assignee}</span>
                  </div>`
                : ''}
              </div>
              ${formattedDate ? `
                 <div class="flex items-center gap-1 ${isOverdue ? 'text-error font-semibold' : ''}">
                     <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-3 h-3"><path fill-rule="evenodd" d="M4 1.75a.75.75 0 0 1 .75.75v.5c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.5a.75.75 0 0 1 1.5 0v.5A2.25 2.25 0 0 1 10.75 4h-4.5A2.25 2.25 0 0 1 4 1.75v-.5a.75.75 0 0 1 .75-.75Zm3.25 7a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1-.75-.75ZM8 12.25a.75.75 0 0 0 0-1.5H6a.75.75 0 0 0 0 1.5h2Z" clip-rule="evenodd"></path><path d="M2 5.5A2.5 2.5 0 0 1 4.5 3h7A2.5 2.5 0 0 1 14 5.5v5A2.5 2.5 0 0 1 11.5 13h-7A2.5 2.5 0 0 1 2 10.5v-5Zm2.5-1A1 1 0 0 0 3.5 6v4a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-7Z"></path></svg>
                     <span>${formattedDate}</span>
                 </div>`
              : ''}
            </div>
          </div>
        `;
      };

      const render = () => {
        // Clear board
        kanbanBoard.innerHTML = '';
        
        // Update progress bar
        const doneCount = tasks.filter(t => t.status === TaskStatus.Done).length;
        const totalCount = tasks.length;
        const progress = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
        progressBar.style.width = `${progress}%`;
        progressText.textContent = `${progress}%`;

        // Create and populate columns
        for (const status of Object.values(TaskStatus)) {
          const column = document.createElement('div');
          column.dataset.status = status;
          column.className = 'kanban-column rounded-xl flex flex-col';
          
          const tasksInColumn = tasks.filter(task => task.status === status);

          column.innerHTML = `
            <div class="p-4 border-t-4 ${statusColors[status]} rounded-t-xl bg-base-200 flex justify-between items-center mb-4 sticky top-0 z-0">
              <h2 class="font-bold text-lg">${status}</h2>
              <span class="bg-base-300 text-base-content text-sm font-semibold rounded-full px-3 py-1">
                ${tasksInColumn.length}
              </span>
            </div>
            <div class="task-list flex-1 px-2 pb-4 space-y-4 overflow-y-auto">
              ${tasksInColumn.length === 0 ? `
                <div class="text-center text-gray-400 italic p-4 border-2 border-dashed border-base-300 rounded-lg">
                  Drop tasks here
                </div>` : 
                tasksInColumn.map(createTaskCardHTML).join('')
              }
            </div>
          `;
          
          column.addEventListener('dragover', handleDragOver);
          column.addEventListener('dragleave', handleDragLeave);
          column.addEventListener('drop', handleDrop);
          
          kanbanBoard.appendChild(column);
        }

        // Add drag listeners to newly rendered cards
        document.querySelectorAll('.task-card').forEach(card => {
            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragend', handleDragEnd);
        });
      };
      
      // --- Event Listeners Setup ---
      addTaskBtn.addEventListener('click', () => openModal());
      taskModal.addEventListener('click', (e) => {
        if (e.target === taskModal) closeModal();
      });
      modalCancelBtn.addEventListener('click', closeModal);
      taskForm.addEventListener('submit', handleSaveTask);

      kanbanBoard.addEventListener('click', (e) => {
        const button = e.target.closest('button[data-action]');
        if (!button) return;

        const action = button.dataset.action;
        const card = button.closest('.task-card');
        const taskId = card.dataset.taskId;
        const task = tasks.find(t => t.id === taskId);
        
        if (action === 'edit') {
            openModal(task);
        } else if (action === 'delete') {
            if (confirm(`Are you sure you want to delete "${task.title}"?`)) {
                handleDeleteTask(taskId);
            }
        } else if (action === 'complete') {
            handleStatusChange(taskId, TaskStatus.Done);
        }
      });
      
      // Initial Load
      loadTasks();
    });
  </script>
</body>
</html>
